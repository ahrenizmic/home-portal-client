<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Portal</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        input, button { padding: 8px; font-size: 16px; }
        .group-header { font-size: 14px; text-transform: uppercase; color: #555; margin: 20px 0 8px; }
        .task.overdue { border-left: 4px solid #c0392b; }
        .task.today { border-left: 4px solid #27ae60; }
        .error { color: #c00; }
        .task { padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        .task-due { font-size: 12px; color: #c0392b; font-weight: bold; }
        .task-text { margin: 4px 0; }
        .task-project { font-size: 12px; color: #888; }
    </style>
</head>
<body>
<h1>Home Portal</h1>
<p id="today"></p>
<input type="password" id="password" placeholder="Пароль" value="test-password">
<button id="loadBtn">Загрузить</button>
<p id="status"></p>
<div id="list"></div>
<script type="module" src="app.js"></script>
</body>
</html>
