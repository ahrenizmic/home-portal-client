<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Portal</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        input, button { padding: 8px; font-size: 16px; }
        #loadBtn { margin-bottom: 24px; }
        #tabs { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }
        .tab {
          padding: 8px 16px; border: none; cursor: pointer;
          background: #ecf0f1; border-radius: 6px; font-size: 15px;
        }
        .tab.active { background: #2980b9; color: white; }
        .group-header { font-size: 14px; text-transform: uppercase; color: #555; margin: 20px 0 8px; }
        .task.overdue { border-left: 4px solid #c0392b; }
        .task.today { border-left: 4px solid #27ae60; }
        .task.future { border-left: 4px solid #2980b9; }
        .subgroup-header { cursor: pointer; padding: 8px; margin: 8px 0 0; font-weight: bold; color: #2980b9; user-select: none; }
        .subgroup-body { padding-left: 12px; }
        .error { color: #c00; }
        .task { padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        .task-due { font-size: 12px; color: #c0392b; font-weight: bold; }
        .task-text { margin: 4px 0; }
        .task-project { font-size: 12px; color: #888; }
        #cal-title { font-size: 18px; margin: 8px 0 16px; text-transform: capitalize; }
        #cal-weekdays {
          display: grid; grid-template-columns: repeat(7, 1fr);
          gap: 4px; margin-bottom: 4px;
        }
        #cal-weekdays div {
          text-align: center; font-size: 12px; color: #888; font-weight: bold;
        }
        #cal-grid {
          display: grid; grid-template-columns: repeat(7, 1fr);
          gap: 4px;
        }
        .cal-cell {
          min-height: 60px; border: 1px solid #ddd; border-radius: 6px;
          padding: 4px; font-size: 14px;
          min-width: 0;
        }
        .cal-cell.empty { border: none; }
        .cal-cell.today { border: 2px solid #2980b9; background: #eaf3fb; }
        .cal-daynum { font-size: 13px; color: #555; }
        .cal-event {
          font-size: 11px; background: #2980b9; color: white;
          border-radius: 3px; padding: 1px 4px; margin-top: 2px;
          overflow-wrap: break-word;        /* длинное слово переносится, не вылезает */
          word-break: break-word;           /* страховка для очень длинных слов */
        }
    </style>
</head>
<body>
<h1>Home Portal</h1>
<p id="today"></p>
<input type="password" id="password" placeholder="Пароль" value="test-password">
<button id="loadBtn">Загрузить</button>
<div id="app" style="display: none;">
    <!-- вкладки переключения экранов -->
    <div id="tabs">
        <button id="tab-tasks" class="tab active">Задачи</button>
        <button id="tab-calendar" class="tab">Календарь</button>
    </div>

    <!-- экран задач (по умолчанию видим) -->
    <div id="screen-tasks" class="screen">
        <div id="status"></div>
        <div id="list"></div>
    </div>

    <!-- экран календаря (по умолчанию скрыт, пока заглушка) -->
    <div id="screen-calendar" class="screen" style="display: none;">
        <h2 id="cal-title"></h2>
        <div id="cal-weekdays"></div>
        <div id="cal-grid"></div>
    </div>
</div>
<script src="rrule.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
